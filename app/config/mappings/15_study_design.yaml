description: "Study design type mappings — ResearchStudy.studyDesign (SEVCO codes from studyType + cohort count)"

mappings:
  - item: Study Design type (from studyType)
    usdm_path: |
      study.versions.studyDesigns.studyType.(
        $Recode := function($c) {
          $c = "C98388" ? {"system": "https://fevir.net/sevco", "code": "SEVCO:01001", "display": "interventional research"} :
          $c = "C16084" ? {"system": "https://fevir.net/sevco", "code": "SEVCO:01002", "display": "observational research"} :
          $c = "C98722" ? {"system": "https://fevir.net/sevco", "code": "SEVCO:01038", "display": "expanded access study"} :
          null
        };
        $sevco := $Recode(code);
        $nci := {"system": "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl", "code": code, "display": decode};
        $sevco ? {id: {"coding": [$sevco, $nci]}} : null
      )
    fhir_resource: ResearchStudy
    fhir_path: studyDesign
    fhir_index: studyDesign
    usdm_class: StudyDesign
    usdm_attribute: studyType

  - item: Study Design cohort design (from intervention model)
    usdm_path: |
      study.versions.studyDesigns.(
        $Recode := function($c) {
          $c = "C82640" ? {"system": "https://fevir.net/sevco", "code": "SEVCO:01016", "display": "uncontrolled cohort design"} :
          $c = "C82639" ? {"system": "https://fevir.net/sevco", "code": "SEVCO:01011", "display": "parallel cohort design"} :
          $c = "C82637" ? {"system": "https://fevir.net/sevco", "code": "SEVCO:01012", "display": "crossover cohort design"} :
          null
        };
        $sevco := $Recode(model.code);
        $sevco ? {id & "_cohort_design": {"coding": [$sevco]}} : null
      )
    fhir_resource: ResearchStudy
    fhir_path: studyDesign
    fhir_index: studyDesign
    usdm_class: StudyDesign
    usdm_attribute: model

  - item: Study Design allocation (randomized characteristic)
    usdm_path: |
      study.versions.studyDesigns.(
        $randomized := characteristics[code = "C46079"];
        $randomized ? {id & "_allocation": {"coding": [{"system": "https://fevir.net/sevco", "code": "SEVCO:01003", "display": "randomized assignment"}]}} : null
      )
    fhir_resource: ResearchStudy
    fhir_path: studyDesign
    fhir_index: studyDesign
    usdm_class: StudyDesign
    usdm_attribute: characteristics

  - item: Study Design masking (masked roles → SEVCO blinding codes)
    usdm_path: |
      study.versions.roles[
        (code.code = "C41189" or code.code = "C17445" or code.code = "C25936" or code.code = "C207599")
        and masking.isMasked = true
      ].(
        $Recode := function($c) {
          $c = "C41189" ? {"code": "SEVCO:01060", "display": "Blinding of study participants"} :
          $c = "C17445" ? {"code": "SEVCO:01061", "display": "Blinding of intervention providers"} :
          $c = "C25936" ? {"code": "SEVCO:01063", "display": "Blinding of investigators"} :
          $c = "C207599" ? {"code": "SEVCO:01062", "display": "Blinding of outcome assessors"} :
          null
        };
        $sevco := $Recode(code.code);
        $sevco ? {id: {"coding": [{"system": "https://fevir.net/sevco", "code": $sevco.code, "display": $sevco.display}]}} : null
      )
    fhir_resource: ResearchStudy
    fhir_path: studyDesign
    fhir_index: studyDesign
    usdm_class: StudyRole
    usdm_attribute: masking

  - item: Study Design masking (open label — no masked role found)
    usdm_path: |
      study.versions.(
        $maskingRoles := roles[
          code.code = "C41189" or code.code = "C17445" or code.code = "C25936" or code.code = "C207599"
        ];
        $count($maskingRoles) > 0 and $count($maskingRoles[masking.isMasked = true]) = 0 ?
          {id & "_masking_none": {"text": "Design Masking: None (Open Label)"}} :
          null
      )
    fhir_resource: ResearchStudy
    fhir_path: studyDesign
    fhir_index: studyDesign
    usdm_class: StudyVersion
    usdm_attribute: roles

  - item: Study Population Source (population description free text)
    usdm_path: |
      study.versions.studyDesigns.(
        population.description ? {id & "_population_source": {"text": "Study Population Source: " & population.description}} : null
      )
    fhir_resource: ResearchStudy
    fhir_path: classifier
    fhir_index: classifier
    usdm_class: StudyDesignPopulation
    usdm_attribute: description

