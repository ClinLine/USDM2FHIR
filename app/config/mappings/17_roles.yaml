description: "Study role mappings — C70793 (Lead Sponsor), C215669 (Co-Sponsor), EXT0003 (Sponsor-Investigator), C19924 (Principal Investigator), EXT0004 (Collaborator) → ResearchStudy.associatedParty + contained PractitionerRole"

mappings:
  # ---------------------------------------------------------------------------
  # C70793 — Lead Sponsor (organization, no party reference)
  # ---------------------------------------------------------------------------

  - item: Associated party name — lead-sponsor (organization label)
    usdm_path: |
      study.versions.roles[code.code = "C70793"].{id: label}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.name
    fhir_index: associatedParty
    usdm_class: StudyRole
    usdm_attribute: label

  - item: Associated party role code — lead-sponsor
    usdm_path: |
      study.versions.roles[code.code = "C70793"].{id: "lead-sponsor"}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.role.coding.code
    fhir_index: associatedParty
    usdm_class: Code
    usdm_attribute: code

  - item: Associated party role display — lead-sponsor
    usdm_path: |
      study.versions.roles[code.code = "C70793"].{id: "Lead sponsor"}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.role.coding.display
    fhir_index: associatedParty
    usdm_class: Code
    usdm_attribute: decode

  - item: Associated party role system — lead-sponsor
    usdm_path: |
      study.versions.roles[code.code = "C70793"].{id: "http://terminology.hl7.org/CodeSystem/research-study-party-role"}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.role.coding.system
    fhir_index: associatedParty

  # ---------------------------------------------------------------------------
  # C215669 — Co-Sponsor (organization, no party reference)
  # ---------------------------------------------------------------------------

  - item: Associated party name — co-sponsor (organization label)
    usdm_path: |
      study.versions.roles[code.code = "C215669"].{id: label}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.name
    fhir_index: associatedParty
    usdm_class: StudyRole
    usdm_attribute: label

  - item: Associated party role code — co-sponsor
    usdm_path: |
      study.versions.roles[code.code = "C215669"].{id: "sponsor"}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.role.coding.code
    fhir_index: associatedParty
    usdm_class: Code
    usdm_attribute: code

  - item: Associated party role display — co-sponsor
    usdm_path: |
      study.versions.roles[code.code = "C215669"].{id: "Sponsor"}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.role.coding.display
    fhir_index: associatedParty
    usdm_class: Code
    usdm_attribute: decode

  - item: Associated party role system — co-sponsor
    usdm_path: |
      study.versions.roles[code.code = "C215669"].{id: "http://terminology.hl7.org/CodeSystem/research-study-party-role"}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.role.coding.system
    fhir_index: associatedParty

  # ---------------------------------------------------------------------------
  # EXT0003 — Sponsor-Investigator (person, with contained PractitionerRole)
  # ---------------------------------------------------------------------------

  - item: Associated party name (assigned person)
    usdm_path: |
      study.versions.roles[code.code = "EXT0003"].{id: assignedPersons[0].text}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.name
    fhir_index: associatedParty
    usdm_class: AssignedPerson
    usdm_attribute: text

  - item: Associated party role code
    usdm_path: |
      study.versions.roles[code.code = "EXT0003"].{id: "sponsor-investigator"}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.role.coding.code
    fhir_index: associatedParty
    usdm_class: Code
    usdm_attribute: code

  - item: Associated party role display
    usdm_path: |
      study.versions.roles[code.code = "EXT0003"].{id: code.decode}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.role.coding.display
    fhir_index: associatedParty
    usdm_class: Code
    usdm_attribute: decode

  - item: Associated party role system
    usdm_path: |
      study.versions.roles[code.code = "EXT0003"].{id: "http://terminology.hl7.org/CodeSystem/research-study-party-role"}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.role.coding.system
    fhir_index: associatedParty

  - item: Associated party reference (points to contained PractitionerRole)
    usdm_path: |
      study.versions.roles[code.code = "EXT0003"].{id: "#" & id}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.party.reference
    fhir_index: associatedParty
    usdm_class: StudyRole
    usdm_attribute: id

  - item: Associated party reference type
    usdm_path: |
      study.versions.roles[code.code = "EXT0003"].{id: "PractitionerRole"}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.party.type
    fhir_index: associatedParty

  - item: Contained PractitionerRole id
    usdm_path: |
      study.versions.roles[code.code = "EXT0003"].{id: id}
    fhir_resource: PractitionerRole
    fhir_path: id
    usdm_class: StudyRole
    usdm_attribute: id

  - item: Contained PractitionerRole code text (assigned person job title)
    usdm_path: |
      study.versions.roles[code.code = "EXT0003"].{id: assignedPersons[0].jobTitle}
    fhir_resource: PractitionerRole
    fhir_path: code.text
    fhir_index: code
    usdm_class: AssignedPerson
    usdm_attribute: jobTitle

  - item: Contained PractitionerRole organization display (role label)
    usdm_path: |
      study.versions.roles[code.code = "EXT0003"].{id: label}
    fhir_resource: PractitionerRole
    fhir_path: organization.display
    usdm_class: StudyRole
    usdm_attribute: label

  - item: Contained PractitionerRole practitioner display (assigned person name)
    usdm_path: |
      study.versions.roles[code.code = "EXT0003"].{id: assignedPersons[0].text}
    fhir_resource: PractitionerRole
    fhir_path: practitioner.display
    usdm_class: AssignedPerson
    usdm_attribute: text

  # ---------------------------------------------------------------------------
  # C19924 — Principal Investigator (person, with contained PractitionerRole)
  # ---------------------------------------------------------------------------

  - item: Associated party name — primary-investigator (assigned person)
    usdm_path: |
      study.versions.roles[code.code = "C19924"].{id: assignedPersons[0].text}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.name
    fhir_index: associatedParty
    usdm_class: AssignedPerson
    usdm_attribute: text

  - item: Associated party role code — primary-investigator
    usdm_path: |
      study.versions.roles[code.code = "C19924"].{id: "primary-investigator"}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.role.coding.code
    fhir_index: associatedParty
    usdm_class: Code
    usdm_attribute: code

  - item: Associated party role display — primary-investigator
    usdm_path: |
      study.versions.roles[code.code = "C19924"].{id: code.decode}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.role.coding.display
    fhir_index: associatedParty
    usdm_class: Code
    usdm_attribute: decode

  - item: Associated party role system — primary-investigator
    usdm_path: |
      study.versions.roles[code.code = "C19924"].{id: "http://terminology.hl7.org/CodeSystem/research-study-party-role"}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.role.coding.system
    fhir_index: associatedParty

  - item: Associated party reference — primary-investigator (points to contained PractitionerRole)
    usdm_path: |
      study.versions.roles[code.code = "C19924"].{id: "#" & id}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.party.reference
    fhir_index: associatedParty
    usdm_class: StudyRole
    usdm_attribute: id

  - item: Associated party reference type — primary-investigator
    usdm_path: |
      study.versions.roles[code.code = "C19924"].{id: "PractitionerRole"}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.party.type
    fhir_index: associatedParty

  - item: Contained PractitionerRole id — primary-investigator
    usdm_path: |
      study.versions.roles[code.code = "C19924"].{id: id}
    fhir_resource: PractitionerRole
    fhir_path: id
    usdm_class: StudyRole
    usdm_attribute: id

  - item: Contained PractitionerRole code text — primary-investigator (job title)
    usdm_path: |
      study.versions.roles[code.code = "C19924"].{id: assignedPersons[0].jobTitle}
    fhir_resource: PractitionerRole
    fhir_path: code.text
    fhir_index: code
    usdm_class: AssignedPerson
    usdm_attribute: jobTitle

  - item: Contained PractitionerRole organization display — primary-investigator (role label)
    usdm_path: |
      study.versions.roles[code.code = "C19924"].{id: label}
    fhir_resource: PractitionerRole
    fhir_path: organization.display
    usdm_class: StudyRole
    usdm_attribute: label

  - item: Contained PractitionerRole practitioner display — primary-investigator (assigned person name)
    usdm_path: |
      study.versions.roles[code.code = "C19924"].{id: assignedPersons[0].text}
    fhir_resource: PractitionerRole
    fhir_path: practitioner.display
    usdm_class: AssignedPerson
    usdm_attribute: text

  # ---------------------------------------------------------------------------
  # EXT0004 — Collaborator (organization, no party reference)
  # ---------------------------------------------------------------------------

  - item: Associated party name — collaborator (organization label)
    usdm_path: |
      study.versions.roles[code.code = "EXT0004"].{id: label}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.name
    fhir_index: associatedParty
    usdm_class: StudyRole
    usdm_attribute: label

  - item: Associated party role code — collaborator
    usdm_path: |
      study.versions.roles[code.code = "EXT0004"].{id: "collaborator"}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.role.coding.code
    fhir_index: associatedParty
    usdm_class: Code
    usdm_attribute: code

  - item: Associated party role display — collaborator
    usdm_path: |
      study.versions.roles[code.code = "EXT0004"].{id: code.decode}
    fhir_resource: ResearchStudy
    fhir_path: associatedParty.role.coding.display
